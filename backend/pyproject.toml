[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the project"
author = "Shashank Rajak"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain[google-genai]>=0.3.26,<0.4.0",
    "langchain-community>=0.3.26",
    "langchain-text-splitters>=0.3.8",
    "python-dotenv>=1.1.1",
    "langgraph>=0.5.0,<0.6.0",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "langchain-chroma>=0.2.4",
    "langchain-huggingface==0.1.2",
    "langchain-core==0.3.68",
    "sentence-transformers>=3.0.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "streamlit>=1.63.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.0.0",
]
